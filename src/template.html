<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$TITLE</title>

    <style>
        :root {
            font-size: 15px;
        }

        body,
        html {
            margin: 0;
            padding: 0;
        }

        article {
            max-width: 70ch;
            padding: 30px;

            margin: auto;
            font-family: serif;

            padding-top: 60px;
            padding-bottom: 200px;
        }

        article p,
        article li {
            line-height: 1.7rem;
            font-size: 1.1rem;
        }

        article li::marker {
            content: "\2736  ";
        }

        article ul {
            padding: 7px;
        }

        article h1,
        article h2,
        article h3,
        article h4,
        article h5,
        article h6 {
            font-family: sans-serif;
        }

        article h1 {
            font-size: 2rem;
            padding-bottom: 10px;
            border-bottom-width: 1px;
            border-bottom-style: solid;
        }

        article h2 {
            font-size: 1.7rem;
        }

        article pre {
            font-size: 0.9rem;
            padding: 20px 0;
            overflow-x: auto;
        }

        article a {
            text-decoration: none;
            padding-left: 5px;
            display: block;
            font-family: sans-serif;
            cursor: pointer;
        }
        article a:hover {
            text-decoration: underline;
        }

        header {
            width: 100%;
            height: 80px;
        }

        .header-content {
            height: 40px;
            line-height: 40px;
            position: relative;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 70ch;
        }

        .icon {
            display: inline;
            image-rendering: crisp-edges;
            background-color: #1e1e2e;
            /* padding: 5px;
            margin-top: -5px; */
        }

        .header-content a {
            font-size: 1.6rem;
            text-transform: uppercase;
            font-family: sans-serif;
            text-decoration: none;
            float: right;
        }

        body.js-disabled .header-content a {
            text-align: center;
            float: inherit;
            width: 100%;
            display: block;
        }

        body.js-disabled a.module-prompt {
            cursor: not-allowed;
        }

        body.js-disabled a.module-prompt::before {
            content: "⚠️";
            padding-right: 6px;
        }

        .lds-ring,
        .lds-ring div {
            box-sizing: border-box;
        }

        .lds-ring {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
        }

        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 8px solid currentColor;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: currentColor transparent transparent transparent;
        }

        .lds-ring div:nth-child(1) {
            animation-delay: -0.45s;
        }

        .lds-ring div:nth-child(2) {
            animation-delay: -0.3s;
        }

        .lds-ring div:nth-child(3) {
            animation-delay: -0.15s;
        }

        .lds-ring {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .lds-ring.hidden {
            display: none;
        }

        @keyframes lds-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media screen and (max-width: 70ch) {
            .header-content {
                max-width: calc(70ch - 250px);
            }
        }

        header {
            background-color: #181825;
        }

        .header-content a {
            color: #cdd6f4;
        }

        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
        }

        article pre {
            scrollbar-color: #7c6f64 #f9f5d7;
        }

        article a {
            color: #89b4fa;
        }

        article a:visited {
            color: #cba6f7;
        }

        article h1 {
            border-color: #45475a;
        }

        body.js-disabled a.module-prompt {
            color: #bac2de;
        }

        ::selection  {
            color: #181825;
            background-color: #cba6f7;
        }
    </style>
</head>

<body class="js-disabled">
    <header>
        <div class="header-content">
            <a href="/">$HOSTNAME</a>
        </div>
    </header>

    <article>
        $CONTENT
    </article>

    <div class="lds-ring hidden"><div></div><div></div><div></div><div></div></div>

    <script>
        const colours = [
            "#f38ba8",
            "#a6e3a1",
            "#f9e2af",
            "#89b4fa",
            "#cba6f7",
            "#94e2d5",
            "#fab387",
        ];
        const bg = "#1e1e2e";

        const size = 40;
        const cells = 5;

        function hashString(str) {
            let hash = 2166136261;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function mulberry32(a) {
            return function () {
                a |= 0;
                a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function createIdenticon(bg, colours, seed) {
            const seedHash = hashString(seed);
            const rand = mulberry32(seedHash);

            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");

            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, size, size);

            const cellSize = size / cells;
            const half = Math.ceil(cells / 2);

            const columnColors = Array.from({ length: half }, () =>
                colours[Math.floor(rand() * colours.length)]
            );

            for (let y = 0; y < cells; y++) {
                for (let x = 0; x < half; x++) {
                    if (rand() > 0.5) {
                        const mirrorX = cells - x - 1;

                        ctx.fillStyle = columnColors[x];

                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                        ctx.fillRect(mirrorX * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }

            return canvas;
        }

        function setFavicon(canvas) {
            const faviconURL = canvas.toDataURL('image/png');

            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.head.appendChild(link);
            }

            link.href = faviconURL;
        }

        function drawIdenticon(bg, colours) {
            const existingIdenticon = document.querySelector(".icon");
            if (existingIdenticon) {
                existingIdenticon.remove();
            }

            const hostnameFull = `${location.hostname}:${location.port}`;
            const identicon = createIdenticon(bg, colours, hostnameFull);
            identicon.classList.add("icon");
            const iconContainer = document.querySelector(".header-content");
            document.body.classList.remove("js-disabled");
            iconContainer.insertAdjacentElement("afterbegin", identicon);

            setFavicon(identicon);
        }

        function loadModule(path) {
            let query = prompt("Start typing:");
            fetch(path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: query
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP POST Error ${response.status}`);
                    }
                    return response.text();
                })
                .then(newPage => {
                    document.querySelector("article").innerHTML = newPage;
                })
                .then(() => {
                    history.pushState(null, '', a.dataset.path);
                });
        }

        document.querySelectorAll(".module-prompt").forEach((a) => {
            a.addEventListener("click", () => loadModule(a.dataset.path));
        });
        window.addEventListener('popstate', (event) => {
            // if you go back from a module we executed, reload to return to
            // original page
            location.reload();
        });

        drawIdenticon(bg, colours);

        const header = document.querySelector("header");
        header.addEventListener("click", () => location.href = "/");
        header.style.cursor = "pointer";

        const article = document.querySelector("article");
        const execCmd = "*exec-module:";
        const loader = document.querySelector(".lds-ring");
        if (article.innerText.startsWith(execCmd)) {
            article.innerText = "";
            document.title = location.hostname;
            loader.classList.remove("hidden");
            loadModule(article.innerText.substring(execCmd.length));
            loader.classList.add("hidden");
            document.title = article.querySelector("h1").innerText;
        }
    </script>
</body>

</html>
